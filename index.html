<!-- Demos do Formulário no Tema Dark Urbano -->
<div class="bg-zinc-950 text-white p-6 rounded-2xl max-w-xl mx-auto border border-zinc-800 font-sans shadow-2xl">
  <!-- Topo -->
  <div class="mb-6">
    <span class="bg-orange-500/10 text-orange-400 text-xs font-bold px-3 py-1 rounded-full border border-orange-500/20">
      TRIAGEM RÁPIDA
    </span>
    <h2 class="text-2xl font-black mt-3 text-zinc-100 tracking-tight">VAMOS VER SEUS DIREITOS, MANA?</h2>
    <p class="text-zinc-400 text-sm mt-1">Responda às perguntas abaixo clicando nos botões. Sem enrolação.</p>
  </div>

  <!-- Etapa de Seleção de Benefício -->
  <div id="step-1" class="space-y-4">
    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider">Qual é a sua dúvida hoje?</label>
    
    <div class="grid grid-cols-1 gap-3">
      <button onclick="selectOption('benefit', 'aposentadoria_idade')" class="w-full text-left p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-orange-500 hover:bg-zinc-850 transition flex justify-between items-center group">
        <div>
          <div class="font-bold text-white group-hover:text-orange-400">Aposentadoria por Idade</div>
          <div class="text-xs text-zinc-400">Mulher (62+) ou Homem (65+)</div>
        </div>
        <span class="text-orange-500 font-bold">→</span>
      </button>

      <button onclick="selectOption('benefit', 'auxilio_doenca')" class="w-full text-left p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-orange-500 hover:bg-zinc-850 transition flex justify-between items-center group">
        <div>
          <div class="font-bold text-white group-hover:text-orange-400">Auxílio-Doença</div>
          <div class="text-xs text-zinc-400">Incapacidade por motivo de saúde</div>
        </div>
        <span class="text-orange-500 font-bold">→</span>
      </button>

      <button onclick="selectOption('benefit', 'trabalhista')" class="w-full text-left p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-orange-500 hover:bg-zinc-850 transition flex justify-between items-center group">
        <div>
          <div class="font-bold text-white group-hover:text-orange-400">Direitos Trabalhistas</div>
          <div class="text-xs text-zinc-400">Demissão, verbas rescisórias ou FGTS</div>
        </div>
        <span class="text-orange-500 font-bold">→</span>
      </button>
    </div>
  </div>

  <!-- Etapa de Múltipla Escolha (Dinamizada pelo JS) -->
  <div id="step-2" class="space-y-4 mt-6 hidden">
    <label class="block text-xs font-bold text-zinc-400 uppercase tracking-wider">Você tem laudo médico recente?</label>
    <div class="grid grid-cols-2 gap-3">
      <button class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 font-bold hover:bg-orange-500 hover:text-black transition">
        Sim, tenho
      </button>
      <button class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 font-bold hover:bg-orange-500 hover:text-black transition">
        Não tenho
      </button>
    </div>
  </div>
</div>
